# Configuração do broker MQTT (Mosquitto) para o projeto de irrigação automática.
# Instalar no Raspberry Pi: sudo apt install mosquitto mosquitto-clients
# Copiar este arquivo para /etc/mosquitto/conf.d/irrigador.conf

# ---------------------------------------------------------------------------
# Listener padrão (usado pelo ESP32 e pelo backend)
# ---------------------------------------------------------------------------
listener 1883
protocol mqtt

# ---------------------------------------------------------------------------
# Autenticação
# ---------------------------------------------------------------------------
# Não deixe allow_anonymous true em produção, mesmo em rede local — qualquer
# dispositivo na WiFi poderia publicar comandos falsos de bomba/threshold.
#
# Gerar o arquivo de senhas (primeira vez):
#   sudo mosquitto_passwd -c /etc/mosquitto/passwd irrigador
# Adicionar mais usuários depois (sem o -c):
#   sudo mosquitto_passwd /etc/mosquitto/passwd outro_usuario
allow_anonymous true

# ---------------------------------------------------------------------------
# Persistência
# ---------------------------------------------------------------------------
# Garante que mensagens retained (status, config, pump) sobrevivem a um
# restart do broker/Raspberry Pi.
persistence true
persistence_location /var/lib/mosquitto/

# ---------------------------------------------------------------------------
# Logs
# ---------------------------------------------------------------------------
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true

# ---------------------------------------------------------------------------
# Limites
# ---------------------------------------------------------------------------
# Suficiente para N ESP32 + o backend; ajuste se tiver muitas dezenas de placas.
max_connections 64
max_queued_messages 200