version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: irrigador-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro

  backend:
    build:
      context: ../backend
    container_name: irrigador-backend
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "3000:3000"
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
    env_file:
      - ../.env
    volumes:
      - backend-db:/app/data
    command: ["uvicorn", "src.app:app", "--host", "0.0.0.0", "--port", "3000"]

volumes:
  mosquitto-data:
  mosquitto-log:
  backend-db: